<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>فروشگاه VPN</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    padding: 0;
    font-family: Tahoma, Arial, sans-serif;
    background: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #111111);
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 20px 15px 30px;
}

.header {
    text-align: center;
    margin-bottom: 25px;
}

.logo {
    font-size: 42px;
    margin-bottom: 8px;
}

.title {
    font-size: 23px;
    font-weight: bold;
}

.subtitle {
    font-size: 14px;
    opacity: .65;
    margin-top: 7px;
}

.menu {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.menu-button {
    width: 100%;
    border: none;
    border-radius: 15px;
    padding: 17px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;

    background: var(--tg-theme-secondary-bg-color, #f1f1f1);
    color: var(--tg-theme-text-color, #111111);

    transition: .15s;
}

.menu-button:active {
    transform: scale(.97);
}

.section-title {
    text-align: center;
    font-size: 22px;
    margin: 10px 0 20px;
}

.back {
    border: none;
    background: transparent;
    color: var(--tg-theme-link-color, #2481cc);
    font-size: 16px;
    cursor: pointer;
    padding: 5px 0;
    margin-bottom: 15px;
}

.category-card {
    background: var(--tg-theme-secondary-bg-color, #f1f1f1);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 14px;
    cursor: pointer;
    transition: .15s;
}

.category-card:active {
    transform: scale(.97);
}

.category-icon {
    font-size: 34px;
    margin-bottom: 8px;
}

.category-title {
    font-size: 18px;
    font-weight: bold;
}

.category-description {
    font-size: 13px;
    opacity: .65;
    margin-top: 7px;
}

.plan-card {
    background: var(--tg-theme-secondary-bg-color, #f1f1f1);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 12px;
}

.plan-info {
    margin-bottom: 14px;
}

.plan-name {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.plan-price {
    font-size: 15px;
    margin-top: 5px;
    opacity: .85;
}

.buy-button {
    width: 100%;
    border: none;
    border-radius: 13px;
    padding: 14px;
    background: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #ffffff);
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.buy-button:active {
    transform: scale(.97);
}

.info-box {
    background: var(--tg-theme-secondary-bg-color, #f1f1f1);
    border-radius: 18px;
    padding: 20px;
    text-align: center;
    line-height: 2;
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}

.price {
    font-size: 20px;
    font-weight: bold;
    margin: 15px 0;
}

.empty {
    text-align: center;
    opacity: .65;
    padding: 30px 10px;
}

.footer {
    text-align: center;
    margin-top: 30px;
    font-size: 12px;
    opacity: .45;
}

</style>

</head>

<body>

<div class="container">

<!-- ================= صفحه اصلی ================= -->

<div id="home" class="screen active">

    <div class="header">

        <div class="logo">🚀</div>

        <div class="title">
            فروشگاه VPN
        </div>

        <div class="subtitle">
            سرویس سریع و پایدار
        </div>

    </div>


    <div class="menu">

        <button class="menu-button"
        onclick="showCategories()">
            🛒 خرید اشتراک
        </button>

        <button class="menu-button"
        onclick="comingSoon('سرویس‌های من')">
            📦 سرویس‌های من
        </button>

        <button class="menu-button"
        onclick="comingSoon('کیف پول')">
            💰 کیف پول
        </button>

        <button class="menu-button"
        onclick="comingSoon('اکانت تست')">
            🔑 اکانت تست
        </button>

        <button class="menu-button"
        onclick="comingSoon('تمدید سرویس')">
            🔄 تمدید سرویس
        </button>

        <button class="menu-button"
        onclick="comingSoon('آموزش')">
            🎓 آموزش
        </button>

        <button class="menu-button"
        onclick="comingSoon('پشتیبانی')">
            💬 پشتیبانی
        </button>

    </div>


    <div class="footer">
        تمامی حقوق محفوظ است
    </div>

</div>


<!-- ================= دسته‌بندی سرویس‌ها ================= -->

<div id="categories" class="screen">

    <button class="back"
    onclick="showHome()">
        ← بازگشت
    </button>

    <h2 class="section-title">
        🛒 خرید اشتراک
    </h2>


    <div class="category-card"
    onclick="showPlans('unlimited')">

        <div class="category-icon">
            👤
        </div>

        <div class="category-title">
            نامحدود کاربر
        </div>

        <div class="category-description">
            اشتراک ۱ ماهه
        </div>

    </div>


    <div class="category-card"
    onclick="showPlans('service')">

        <div class="category-icon">
            ⚙️
        </div>

        <div class="category-title">
            سرویس
        </div>

        <div class="category-description">
            اشتراک ۱ ماهه
        </div>

    </div>


    <div class="category-card"
    onclick="showPlans('volume')">

        <div class="category-icon">
            ♾️
        </div>

        <div class="category-title">
            حجمی
        </div>

        <div class="category-description">
            نامحدود زمانی
        </div>

    </div>

</div>


<!-- ================= لیست پلن‌ها ================= -->

<div id="plans" class="screen">

    <button class="back"
    onclick="showCategories()">
        ← بازگشت
    </button>

    <h2 class="section-title"
    id="plansTitle">
        سرویس‌ها
    </h2>

    <div id="plansList"></div>

</div>


<!-- ================= تأیید سفارش ================= -->

<div id="checkout" class="screen">

    <button class="back"
    onclick="backToPlans()">
        ← بازگشت
    </button>

    <h2 class="section-title">
        🧾 تأیید سفارش
    </h2>


    <div class="plan-card">

        <div class="plan-info">

            <div class="plan-name"
            id="checkoutType">
                👤 نامحدود کاربر
            </div>

            <div class="plan-price"
            id="checkoutPlan">
                📦 حجم: 50 گیگ
            </div>

            <div class="plan-price"
            id="checkoutDuration">
                ⏳ مدت: ۱ ماهه
            </div>

            <div class="price"
            id="checkoutPrice">
                💰 مبلغ: 230,000 تومان
            </div>

        </div>


        <button class="buy-button"
        onclick="payment()">

            💳 پرداخت

        </button>

    </div>

</div>


<!-- ================= صفحه اطلاعات ================= -->

<div id="info" class="screen">

    <button class="back"
    onclick="showHome()">
        ← بازگشت
    </button>

    <div class="info-box"
    id="infoContent">

    </div>

</div>


</div>


<script>

/* ================= Telegram ================= */

const tg = window.Telegram.WebApp;

tg.ready();

tg.expand();


/* ================= متغیرها ================= */

let currentCategory = "";

let currentPlan = "";

let currentPrice = "";


/* ================= نمایش صفحه ================= */

function hideAll() {

    document.querySelectorAll(".screen")
    .forEach(function(screen) {

        screen.classList.remove("active");

    });

}


/* ================= صفحه اصلی ================= */

function showHome() {

    hideAll();

    document.getElementById("home")
    .classList.add("active");

}


/* ================= دسته‌بندی ================= */

function showCategories() {

    hideAll();

    document.getElementById("categories")
    .classList.add("active");

}


/* ================= پلن‌ها ================= */

function showPlans(category) {

    currentCategory = category;

    hideAll();

    document.getElementById("plans")
    .classList.add("active");


    const list =
        document.getElementById("plansList");

    list.innerHTML = "";


    let title = "";

    let plans = [];


    /* نامحدود کاربر */

    if (category === "unlimited") {

        title = "👤 نامحدود کاربر";

        plans = [

            ["30 گیگ", "150,000 تومان"],

            ["40 گیگ", "190,000 تومان"],

            ["50 گیگ", "230,000 تومان"],

            ["60 گیگ", "270,000 تومان"]

        ];

    }


    /* سرویس */

    if (category === "service") {

        title = "⚙️ سرویس";

        plans = [

            ["30 گیگ", "100,000 تومان"],

            ["40 گیگ", "140,000 تومان"],

            ["50 گیگ", "180,000 تومان"],

            ["60 گیگ", "220,000 تومان"],

            ["نامحدود", "350,000 تومان"]

        ];

    }


    /* حجمی */

    if (category === "volume") {

        title = "♾️ حجمی";

        plans = [

            ["50 گیگ", "220,000 تومان"],

            ["60 گیگ", "280,000 تومان"]

        ];

    }


    document.getElementById("plansTitle")
    .innerText = title;


    plans.forEach(function(item) {

        const plan = item[0];

        const price = item[1];


        let duration = "۱ ماهه";

        let type = title;


        if (category === "volume") {

            duration = "نامحدود زمانی";

        }


        const card =
            document.createElement("div");

        card.className = "plan-card";


        card.innerHTML = `

            <div class="plan-info">

                <div class="plan-name">
                    📦 ${plan}
                </div>

                <div class="plan-price">
                    ⏳ ${duration}
                </div>

                <div class="plan-price">
                    💰 ${price}
                </div>

            </div>

            <button class="buy-button">
                🛒 خرید
            </button>

        `;


        card.querySelector(".buy-button")
        .addEventListener("click", function() {

            buyPlan(
                plan,
                price,
                type,
                duration
            );

        });


        list.appendChild(card);

    });

}


/* ================= خرید پلن ================= */

function buyPlan(
    plan,
    price,
    type,
    duration
) {

    currentPlan = plan;

    currentPrice = price;


    document.getElementById("checkoutType")
    .innerText = type;


    document.getElementById("checkoutPlan")
    .innerText =
        "📦 حجم: " + plan;


    document.getElementById("checkoutDuration")
    .innerText =
        "⏳ مدت: " + duration;


    document.getElementById("checkoutPrice")
    .innerText =
        "💰 مبلغ: " + price;


    hideAll();

    document.getElementById("checkout")
    .classList.add("active");

}


/* ================= بازگشت از پرداخت ================= */

function backToPlans() {

    showPlans(currentCategory);

}


/* ================= پرداخت ================= */

function payment() {

    tg.showAlert(

        "💳 بخش پرداخت\n\n" +

        "سفارش شما:\n" +

        currentPlan + "\n\n" +

        "مبلغ: " +
        currentPrice +

        "\n\n" +

        "درگاه پرداخت در مرحله بعد متصل می‌شود."

    );

}


/* ================= سایر بخش‌ها ================= */

function comingSoon(name) {

    tg.showAlert(

        "📌 " + name +

        "\n\n" +

        "این بخش به‌زودی فعال می‌شود."

    );

}


/* ================= جلوگیری از زوم ================= */

document.addEventListener(
    "gesturestart",
    function(event) {

        event.preventDefault();

    }
);

</script>

</body>

</html>
