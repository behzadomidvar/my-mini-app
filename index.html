<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>فروشگاه VPN</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px 15px;
            font-family: Tahoma, Arial, sans-serif;
            background: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
        }

        .container {
            max-width: 500px;
            margin: auto;
        }

        .header {
            text-align: center;
            padding: 15px 10px 20px;
        }

        .logo {
            font-size: 50px;
        }

        h1 {
            margin: 8px 0;
            font-size: 24px;
        }

        .welcome {
            opacity: 0.65;
            font-size: 14px;
        }

        .menu {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .menu-button,
        .category-card,
        .plan-card {
            width: 100%;
            border: none;
            border-radius: 18px;
            background: var(--tg-theme-secondary-bg-color);
            color: var(--tg-theme-text-color);
            cursor: pointer;
        }

        .menu-button {
            padding: 18px;
            font-size: 17px;
            font-weight: bold;
            text-align: right;
        }

        .menu-button:active,
        .category-card:active,
        .plan-card:active {
            transform: scale(0.98);
        }

        .emoji {
            font-size: 24px;
            margin-left: 10px;
            vertical-align: middle;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .back {
            border: none;
            background: transparent;
            color: var(--tg-theme-link-color);
            font-size: 16px;
            padding: 5px 0 15px;
            cursor: pointer;
        }

        .section-title {
            text-align: center;
            margin: 5px 0 20px;
            font-size: 21px;
        }

        .cards {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .category-card {
            padding: 20px;
            text-align: right;
        }

        .category-icon {
            font-size: 35px;
            float: right;
            margin-left: 15px;
        }

        .category-name {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .category-info {
            opacity: 0.65;
            font-size: 13px;
        }

        .plan-card {
            padding: 18px;
            text-align: right;
        }

        .plan-name {
            font-size: 18px;
            font-weight: bold;
        }

        .plan-price {
            margin-top: 8px;
            font-size: 17px;
        }

        .buy-button {
            margin-top: 14px;
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 13px;
            font-size: 16px;
            font-weight: bold;
            background: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            cursor: pointer;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            opacity: 0.5;
            font-size: 12px;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- صفحه اصلی -->
    <div id="home" class="screen active">

        <div class="header">
            <div class="logo">🔐</div>

            <h1>فروشگاه VPN</h1>

            <div class="welcome" id="welcome">
                خوش آمدید 👋
            </div>
        </div>

        <div class="menu">

            <button class="menu-button" onclick="showCategories()">
                <span class="emoji">🛒</span>
                خرید اشتراک
            </button>

            <button class="menu-button" onclick="comingSoon()">
                <span class="emoji">📦</span>
                سرویس‌های من
            </button>

            <button class="menu-button" onclick="comingSoon()">
                <span class="emoji">💰</span>
                کیف پول
            </button>

            <button class="menu-button" onclick="comingSoon()">
                <span class="emoji">🔑</span>
                اکانت تست
            </button>

            <button class="menu-button" onclick="comingSoon()">
                <span class="emoji">🔄</span>
                تمدید سرویس
            </button>

            <button class="menu-button" onclick="comingSoon()">
                <span class="emoji">🎓</span>
                آموزش
            </button>

            <button class="menu-button" onclick="comingSoon()">
                <span class="emoji">💬</span>
                پشتیبانی
            </button>

        </div>

        <div class="footer">
            فروش امن و سریع سرویس VPN
        </div>

    </div>


    <!-- دسته بندی اشتراک ها -->
    <div id="categories" class="screen">

        <button class="back" onclick="showHome()">
            ← بازگشت
        </button>

        <h2 class="section-title">
            🛒 خرید اشتراک
        </h2>

        <div class="cards">

            <button class="category-card" onclick="showPlans('user')">
                <span class="category-icon">👤</span>

                <div class="category-name">
                    نامحدود کاربر
                </div>

                <div class="category-info">
                    اشتراک ۱ ماهه
                </div>
            </button>


            <button class="category-card" onclick="showPlans('service')">
                <span class="category-icon">⚙️</span>

                <div class="category-name">
                    سرویس
                </div>

                <div class="category-info">
                    اشتراک ۱ ماهه
                </div>
            </button>


            <button class="category-card" onclick="showPlans('volume')">
                <span class="category-icon">♾️</span>

                <div class="category-name">
                    حجمی
                </div>

                <div class="category-info">
                    نامحدود زمانی
                </div>
            </button>

        </div>

    </div>


    <!-- پلن ها -->
    <div id="plans" class="screen">

        <button class="back" onclick="showCategories()">
            ← بازگشت
        </button>

        <h2 class="section-title" id="plansTitle">
            اشتراک‌ها
        </h2>

        <div class="cards" id="plansList"></div>

    </div>

</div>


<script>

    const tg = window.Telegram.WebApp;

    tg.ready();
    tg.expand();


    // نام کاربر تلگرام
    const user = tg.initDataUnsafe?.user;

    if (user) {
        document.getElementById("welcome").innerText =
            "سلام " + (user.first_name || "دوست من") + " 👋";
    }


    function hideAll() {
        document.querySelectorAll(".screen").forEach(screen => {
            screen.classList.remove("active");
        });
    }


    function showHome() {
        hideAll();
        document.getElementById("home").classList.add("active");
    }


    function showCategories() {
        hideAll();
        document.getElementById("categories").classList.add("active");
    }


    function showPlans(type) {

        hideAll();

        const title = document.getElementById("plansTitle");
        const list = document.getElementById("plansList");

        list.innerHTML = "";

        let plans = [];

        if (type === "user") {

            title.innerText = "👤 نامحدود کاربر — ۱ ماهه";

            plans = [
                ["30 گیگ", "150 تومان"],
                ["40 گیگ", "190 تومان"],
                ["50 گیگ", "230 تومان"],
                ["60 گیگ", "270 تومان"]
            ];

        }

        if (type === "service") {

            title.innerText = "⚙️ سرویس — ۱ ماهه";

            plans = [
                ["30 گیگ", "100 تومان"],
                ["40 گیگ", "140 تومان"],
                ["50 گیگ", "180 تومان"],
                ["60 گیگ", "220 تومان"],
                ["نامحدود", "350 تومان"]
            ];

        }

        if (type === "volume") {

            title.innerText = "♾️ حجمی — نامحدود زمانی";

            plans = [
                ["50 گیگ", "220 تومان"],
                ["60 گیگ", "280 تومان"]
            ];

        }


        plans.forEach(plan => {

            const card = document.createElement("div");

            card.className = "plan-card";

            card.innerHTML = `
                <div class="plan-name">
                    📦 ${plan[0]}
                </div>

                <div class="plan-price">
                    💰 ${plan[1]}
                </div>

                <button class="buy-button"
                        onclick="buyPlan('${plan[0]}', '${plan[1]}')">
                    🛒 خرید
                </button>
            `;

            list.appendChild(card);

        });

        document.getElementById("plans").classList.add("active");
    }


    function buyPlan(plan, price) {

        tg.showAlert(
            "پلن انتخاب شده:\n\n" +
            "📦 " + plan +
            "\n💰 " + price +
            "\n\nسیستم پرداخت در مرحله بعد فعال می‌شود."
        );

    }


    function comingSoon() {

        tg.showAlert(
            "🚀 این بخش به‌زودی فعال می‌شود."
        );

    }

</script>

</body>
</html>
